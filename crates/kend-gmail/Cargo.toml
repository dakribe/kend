[package]
name = "kend-gmail"
version.workspace = true
edition.workspace = true

[dependencies]
base64 = "0.23.1"
encoding_rs = "0.8.44"
html2text = "0.17.4"
keyring-core = "1.0.1"
open = "5.4.5"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
ureq = { version = "3.5.1", features = ["json"] }
url = "2.5.8"

[lints]
workspace = true

[build-dependencies]
dotenvy = "0.15.7"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
