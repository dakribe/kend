[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
# Rune is pre-release: pin a rev of its `dev` branch, which is never rewritten.
rune = { git = "https://github.com/anomalyco/rune", rev = "0ea75abef0a6caa014067a88f89518b9a04cce2b" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "0ea75abef0a6caa014067a88f89518b9a04cce2b" }
kend-gmail = { path = "crates/kend-gmail" }
kend-store = { path = "crates/kend-store" }
kend-sync = { path = "crates/kend-sync" }

# Line tables keep backtraces readable without the memory cost of full debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
# Dependencies (Rune, wgpu, the text stack) build optimized even in debug builds, so `cargo run`
# scrolls smoothly while kend's own code stays quick to compile and debug.
opt-level = 2

[profile.release]
codegen-units = 16
incremental = true

[workspace.lints.clippy]
dbg_macro = "deny"
unwrap_used = "warn"
expect_used = "warn"
